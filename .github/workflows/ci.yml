name: CI

on:
  push:
    branches: [master, main, staging, develop]
  pull_request:
    branches: [master, main, staging]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: |
          files=$(find src/ -name '*.js' -not -path '*/node_modules/*')
          for f in $files; do node --check "$f" || exit 1; done
          echo "✓ Syntax check passed ($(echo $files | wc -w) files)"

      - name: Build Docker image
        run: docker build -t bot-ia-hubspot .
