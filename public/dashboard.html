<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dashboard - Bot IA HubSpot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/dashboard/styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-logo">B</div>
      <div class="sidebar-brand-name">Bot IA</div>
    </div>
    <nav class="sidebar-nav">
      <button class="nav-item active" data-view="overview">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
        <span>Resumen</span>
      </button>
      <button class="nav-item" data-view="conversations">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span>Conversaciones</span>
      </button>
      <button class="nav-item" data-view="handoffs">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 0 1 10 10 4 4 0 0 1-4 4h-2a2 2 0 0 0-2 2v.5a2.5 2.5 0 0 1-2.5 2.5c-1.66 0-3-1.34-3-3V16a6 6 0 0 1 5.5-6z"/></svg>
        <span>Handoffs</span>
      </button>
      <button class="nav-item" data-view="leads">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>Leads</span>
      </button>
      <button class="nav-item" data-view="clients">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2a2 2 0 0 1 2 2v2h8a2 2 0 0 1 2 2v3a7 7 0 0 1-14 0V4a2 2 0 0 1 2-2z"/><path d="M3 12h4v3H3z"/></svg>
        <span>Chatbots</span>
      </button>
      <button class="nav-item" data-view="appointments">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span>Citas</span>
      </button>
    </nav>
    <div class="sidebar-footer">
      <div class="status-row">
        <span class="status-chip"><span class="status-dot on" id="dot-ollama"></span>Ollama</span>
        <span class="status-chip"><span class="status-dot on" id="dot-db"></span>DB</span>
      </div>
      <form action="/logout" method="post">
        <button class="logout-btn" type="submit">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          <span>Cerrar sesión</span>
        </button>
      </form>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <h1 id="pageTitle">Resumen</h1>
      <div class="topbar-right">
        <span class="last-update" id="lastUpdate">—</span>
        <button class="btn btn-primary" id="refreshBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          Actualizar
        </button>
      </div>
    </header>

    <div class="content">
      <section class="view active" data-view="overview" id="view-overview"></section>
      <section class="view" data-view="conversations" id="view-conversations"></section>
      <section class="view" data-view="handoffs" id="view-handoffs"></section>
      <section class="view" data-view="leads" id="view-leads"></section>
      <section class="view" data-view="clients" id="view-clients"></section>
      <section class="view" data-view="appointments" id="view-appointments"></section>
    </div>
  </main>
</div>

<div id="modalRoot"></div>

<script type="module" src="/dashboard/js/main.js"></script>
</body>
</html>
